<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="Helvetica, Arial, sans-serif" font-size="10.5">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A8A"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8443F"/></marker>
</defs>
<rect x="0" y="0" width="900" height="510" fill="white"/>
<text x="18" y="22" font-size="11" font-weight="bold" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">BEVFormer V2 encoder layer (x6, frozen) and the current-frame high-resolution front residual</text>
<rect x="30" y="42" width="330" height="48" rx="6" fill="#EEF0F4" stroke="#6E7B8E" stroke-width="1.2" fill-opacity="1.0" />
<text x="195.0" y="56.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">BEV queries Q  (60,000 x 256)</text>
<text x="195.0" y="68.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">300 x 200 learned embeddings + row/column position (128+128)</text>
<rect x="30" y="112" width="330" height="82" rx="6" fill="#EEF0F4" stroke="#6E7B8E" stroke-width="1.2" fill-opacity="1.0" />
<text x="195.0" y="126.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Temporal self-attention (T1 form)</text>
<text x="195.0" y="138.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">deformable; queue = {Q, Q} (current BEV duplicated)</text>
<text x="195.0" y="150.0" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">8 heads x 4 points per queue; offsets from [Q, Q+pos]</text>
<text x="195.0" y="161.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">value_proj / output_proj 256 x 256; 0.23 M</text>
<rect x="30" y="216" width="330" height="112" rx="6" fill="#EEF0F4" stroke="#6E7B8E" stroke-width="1.2" fill-opacity="1.0" />
<text x="195.0" y="230.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Multi-scale spatial cross-attention</text>
<text x="195.0" y="242.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">4 pillar heights z in [-5, 3] m -&gt; calibrated pinhole/fisheye projection</text>
<text x="195.0" y="254.0" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">8 heads x 4 FPN levels x 8 points per visible view</text>
<text x="195.0" y="265.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">visible-view average + level/camera embeddings; 0.33 M</text>
<rect x="30" y="350" width="330" height="58" rx="6" fill="#EEF0F4" stroke="#6E7B8E" stroke-width="1.2" fill-opacity="1.0" />
<text x="195.0" y="364.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">FFN 256 -&gt; 512 -&gt; 256</text>
<text x="195.0" y="376.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">ReLU, dropout 0.1; 0.26 M; three post-norm LayerNorms</text>
<rect x="30" y="430" width="330" height="44" rx="6" fill="#FFFFFF" stroke="#444444" stroke-width="1.2" fill-opacity="1.0" />
<text x="195.0" y="444.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Layer-6 output B_enc (current BEV)</text>
<text x="195.0" y="456.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">also passed to T8 temporal fusion</text>
<path d="M 195.0 90 L 195.0 112" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 195.0 194 L 195.0 216" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 195.0 328 L 195.0 350" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 195.0 408 L 195.0 430" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="370" y="155" font-size="8.5" font-weight="normal" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">LN</text>
<text x="370" y="270" font-size="8.5" font-weight="normal" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">LN</text>
<text x="370" y="378" font-size="8.5" font-weight="normal" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">LN</text>
<rect x="390" y="112" width="190" height="82" rx="6" fill="#E3EEF9" stroke="#3F6FAE" stroke-width="1.2" fill-opacity="1.0" />
<text x="485.0" y="126.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Camera FPN features</text>
<text x="485.0" y="138.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">6 views x 4 levels x 256 ch</text>
<text x="485.0" y="150.0" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">512 px base tiles; history pyramids cached</text>
<path d="M 485 194 L 485 194 L 485 260 L 360 260" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="485" y="223.0" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">values</text>
<rect x="610" y="42" width="260" height="62" rx="6" fill="#E3EEF9" stroke="#3F6FAE" stroke-width="1.2" fill-opacity="1.0" />
<text x="740.0" y="56.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Native front tile 1024 x 1024 (t = 0)</text>
<text x="740.0" y="68.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">shared ResNet-50 + FPN; 4 levels, one view</text>
<rect x="610" y="126" width="260" height="112" rx="6" fill="#EEF0F4" stroke="#6E7B8E" stroke-width="1.2" fill-opacity="1.0" />
<text x="740.0" y="140.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Front cross-attention (frozen copy of layer 6)</text>
<text x="740.0" y="152.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">reference points from the calibrated front-camera operator</text>
<text x="740.0" y="164.0" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">content-only delta: no level/camera embedding affine terms</text>
<text x="740.0" y="175.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">delta = LN6(Q + attn) - LN6(Q); masked to observed cells</text>
<rect x="610" y="260" width="260" height="62" rx="6" fill="#E2F3E4" stroke="#2E8B57" stroke-width="1.2" fill-opacity="1.0" />
<text x="740.0" y="274.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Gate tanh(g), g in R^256, zero-initialised</text>
<text x="740.0" y="286.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">only trainable camera-side parameter: 256 values</text>
<rect x="789" y="252" width="78" height="14" rx="7" fill="#444" />
<text x="828.0" y="262.5" font-size="8.5" font-weight="bold" text-anchor="middle" fill="white" font-family="Helvetica, Arial, sans-serif">gate train</text>
<rect x="610" y="344" width="260" height="64" rx="6" fill="#FFFFFF" stroke="#444444" stroke-width="1.2" fill-opacity="1.0" />
<text x="740.0" y="358.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">B_0 = B_enc + tanh(g) * delta</text>
<text x="740.0" y="370.5" font-size="9.0" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">at initialisation: B_0 = B_enc exactly (no-op)</text>
<rect x="610" y="430" width="260" height="44" rx="6" fill="#EEF0F4" stroke="#6E7B8E" stroke-width="1.2" fill-opacity="1.0" />
<text x="740.0" y="444.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">T8 fusion input: B_0 + 7 detached history BEVs</text>
<path d="M 740.0 104 L 740.0 126" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 740.0 238 L 740.0 260" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 740.0 322 L 740.0 344" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 740.0 408 L 740.0 430" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="380" y="452" font-size="8.5" font-weight="normal" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">B_enc also enters the front residual</text>
<rect x="30" y="491" width="14" height="10" fill="#E3EEF9" stroke="#3F6FAE"/>
<text x="48" y="500" font-size="9.5" font-weight="normal" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">input</text>
<rect x="93.0" y="491" width="14" height="10" fill="#EEF0F4" stroke="#6E7B8E"/>
<text x="111.0" y="500" font-size="9.5" font-weight="normal" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">frozen</text>
<rect x="162.2" y="491" width="14" height="10" fill="#E2F3E4" stroke="#2E8B57"/>
<text x="180.2" y="500" font-size="9.5" font-weight="normal" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">trainable</text>
<text x="570" y="500" font-size="8.5" font-weight="normal" text-anchor="middle" fill="#555" font-family="Helvetica, Arial, sans-serif">The 1024-pixel branch is used only for t=0; every historical front image remains 512 x 512.</text>
</svg>
