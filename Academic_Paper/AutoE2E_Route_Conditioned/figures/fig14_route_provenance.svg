<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="Helvetica, Arial, sans-serif" font-size="10.5">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A8A"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8443F"/></marker>
</defs>
<rect x="0" y="0" width="760" height="250" fill="white"/>
<text x="14" y="22" font-size="11" font-weight="bold" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">How the KITScenes HD Map and Route rasters are produced (scene-level, a-posteriori route)</text>
<rect x="14" y="40" width="170" height="90" rx="6" fill="#E3EEF9" stroke="#3F6FAE" stroke-width="1.2" fill-opacity="1.0" />
<text x="99.0" y="54.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Lanelet2 map (map.osm)</text>
<text x="99.0" y="66.1" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">lanelet polygons -&gt; drivable / intersection</text>
<text x="99.0" y="77.19999999999999" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">left/right bounds -&gt; lane boundary</text>
<text x="99.0" y="88.29999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">centerlines -&gt; centerline + direction</text>
<text x="99.0" y="99.39999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">crosswalk subtype; stop lines; traffic lights</text>
<rect x="204" y="40" width="170" height="90" rx="6" fill="#E3EEF9" stroke="#3F6FAE" stroke-width="1.2" fill-opacity="1.0" />
<text x="289.0" y="54.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Recorded ego trace (whole scene)</text>
<text x="289.0" y="66.1" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">10 Hz poses (x, y, yaw)</text>
<text x="289.0" y="77.19999999999999" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">used ONLY for route matching</text>
<text x="289.0" y="88.29999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">no future ego points are rasterised</text>
<rect x="394" y="40" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#444444" stroke-width="1.2" fill-opacity="1.0" />
<text x="479.0" y="54.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Lanelet2 trace matcher</text>
<text x="479.0" y="66.1" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">candidate radius 8 m, dist. sigma 2 m</text>
<text x="479.0" y="77.19999999999999" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">heading sigma 20 deg; transition costs</text>
<text x="479.0" y="88.29999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">same 0 / following 0.25 / adjacent 1 /</text>
<text x="479.0" y="99.39999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">disconnected 25; quality thresholds</text>
<rect x="584" y="40" width="162" height="90" rx="6" fill="#FBE5E3" stroke="#B8443F" stroke-width="1.2" fill-opacity="1.0" />
<text x="665.0" y="54.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Route = driven lane sequence</text>
<text x="665.0" y="66.1" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">lane-level corridor (3.5 m wide)</text>
<text x="665.0" y="77.19999999999999" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">destination = last scene pose (r = 2 m)</text>
<text x="665.0" y="88.29999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">confidence &amp; quality metadata</text>
<text x="665.0" y="99.39999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">route_valid may be false</text>
<path d="M 184 85 L 204 85" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 374 85 L 394 85" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 564 85 L 584 85" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="14" y="156" width="350" height="70" rx="6" fill="#FFFFFF" stroke="#444444" stroke-width="1.2" fill-opacity="1.0" />
<text x="189.0" y="170.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Native C++ rasteriser (450 x 300 @ 0.4 m, ego frame)</text>
<text x="189.0" y="182.1" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">rendered at 500 ms anchor poses (latest non-future pose),</text>
<text x="189.0" y="193.2" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">then SE(2)-warped to the exact sample pose</text>
<text x="189.0" y="204.29999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">14 map channels in [0,1] + 2 binary route channels</text>
<rect x="394" y="156" width="352" height="70" rx="6" fill="#FFFDF2" stroke="#C9B458" stroke-width="1.2" fill-opacity="1.0" />
<text x="570.0" y="170.5" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#222" font-family="Helvetica, Arial, sans-serif">Implication for interpretation</text>
<text x="570.0" y="182.1" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">the route is the lane sequence the human actually drove;</text>
<text x="570.0" y="193.2" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">it is an oracle-quality navigation intent, not a live planner output;</text>
<text x="570.0" y="204.29999999999998" font-size="8.6" font-weight="normal" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">route reconstruction IoU measures preservation of this input</text>
<path d="M 99 130 L 99 156" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M 665 130 L 665 156" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
