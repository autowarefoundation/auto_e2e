<path d="M 506 388 L 526 388" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="260" y="452" font-size="8.5" font-weight="normal" text-anchor="start" fill="#B8443F" font-family="Helvetica, Arial, sans-serif">Val and Test are different scene populations: Test minus Val is not a Map/Route effect.</text>
