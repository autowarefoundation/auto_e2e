name: CI

on:
  push:
  pull_request:

# Skip stale in-flight runs when a new push lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Cap hung runs well below the 6h GitHub default.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv installs the pins faster than pip. The cache is keyed
      # on requirements.txt so torch is only re-downloaded when the pins change.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        # Install into the setup-python interpreter like pip did. best-match
        # picks each package's newest version across both indexes, as pip does;
        # uv's default would take old transitive deps from the PyTorch index.
        env:
          UV_SYSTEM_PYTHON: "1"
          UV_INDEX_STRATEGY: unsafe-best-match
        run: make setup PIP="uv pip"

      # `if: always()` on the later steps reports failures from every check,
      # not just the first one that fails.
      - name: Lint with ruff
        run: make lint

      - name: Type-check with mypy
        if: always()
        run: make typecheck

      - name: Run unit tests
        if: always()
        run: make test
