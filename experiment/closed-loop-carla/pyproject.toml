[project]
name = "autoe2e-acs"
version = "0.1.0"
description = "autoware_carla_scenario presets for closed-loop runs of AutoE2E in CARLA"
requires-python = ">=3.10,<3.15"
dependencies = [
    # 28.3.3 declares driver cameras relative to the rear axle (#947), the rig
    # origin the policy plans in.
    "autoware-carla-scenario>=28.3.3",
]

[project.optional-dependencies]
# Cameras generated by the Cosmos3 world model (cosmos3-canvas) through carla_canvas:
# its client loads into the run (canvas.config).
cosmos = ["carla-canvas[client]>=0.2"]

[project.entry-points."autoware_carla_scenario.scenarios"]
autoe2e_acs = "autoe2e_acs:register"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["autoe2e_acs"]
