# @package _global_
#
# AutoE2E driving the ego with the nuplan rig, generated by
# Model/plugins/carla_driver/tools/acs_preset.py in autowarefoundation/auto_e2e:
#
#   carla-driver-interface serve --policy acs_autoe2e.policy:AutoE2EPolicy \
#       --policy-arg checkpoint_path=<checkpoint> --port 50051
#   scenario driver=autoe2e_nuplan_cosmos driver.address=localhost:50051 canvas.config=<cosmos3 canvas.yaml>
#
# The Hyperion 8 cameras Cosmos3 generates, at the dataset cameras' mounts; see the tool.
defaults:
  - default
  - _self_

ego:
  vehicle_type: vehicle.lincoln.mkz
  entity: carla_driver

driver:
  # AutoE2E plans at 10 Hz from frames 500 ms apart.
  policy_timestep_s: 0.1
  # 6.4 s of egomotion and 3.5 s of camera history before it drives.
  warmup_s: 7.0
  rear_axle_offset_m: -1.425
  cameras:
    - logical_id: camera_front_wide_120fov
      image_width: 832
      image_height: 480
      fov: 120.0
      fps: 10.0
      position_x: 0.2451
      position_y: 0.0259
      position_z: 1.5226
      roll: -0.502
      pitch: -1.45
      yaw: -0.165
      lens:
        model: "ftheta"
        principal_point: [412.641208, 242.790324]
        pixeldist_to_angle_poly: [0.0, 0.00243165382, -4.05625414e-08, 6.10818843e-10, -9.93181484e-13, 8.73787714e-16]
        angle_to_pixeldist_poly: [0.0, 411.286296, 2.40299018, -16.2530848, 10.3586782, -3.39986006]
        max_angle: 1.226783919
        linear_cde: [1.00234926, 0.0, 0.0]
        reference_poly: "pixeldist_to_angle"
    - logical_id: camera_cross_left_120fov
      image_width: 832
      image_height: 480
