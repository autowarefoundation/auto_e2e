# @package _global_
#
# AutoE2E driving the ego with the nuplan rig, generated by
# Model/plugins/carla_driver/tools/acs_preset.py in autowarefoundation/auto_e2e:
#
#   carla-driver-interface serve --policy acs_autoe2e.policy:AutoE2EPolicy \
#       --policy-arg checkpoint_path=<checkpoint> --port 50051
#   scenario driver=autoe2e_nuplan driver.address=localhost:50051
#
# Each camera keeps the dataset mount and angular field of view; see the tool.
defaults:
  - default
  - _self_

ego:
  vehicle_type: vehicle.lincoln.mkz
  entity: carla_driver

driver:
  # AutoE2E plans at 10 Hz from frames 500 ms apart.
  policy_timestep_s: 0.1
  # 6.4 s of egomotion and 3.5 s of camera history before it drives.
  warmup_s: 7.0
  rear_axle_offset_m: -1.425
  cameras:
    - logical_id: CAM_F0
      image_width: 1920
      image_height: 964
      fov: 72.225
      fps: 10.0
      position_x: 0.2451
      position_y: 0.0259
      position_z: 1.5226
      roll: -0.502
      pitch: -1.45
      yaw: -0.165
    - logical_id: CAM_L0
      image_width: 1920
      image_height: 964
      fov: 72.225
      fps: 10.0
      position_x: 0.2214
      position_y: -0.1434
      position_z: 1.5215
      roll: -0.792
      pitch: -0.544
      yaw: -55.175
    - logical_id: CAM_R0
      image_width: 1920
      image_height: 964
      fov: 72.225
      fps: 10.0
      position_x: 0.2012
      position_y: 0.1615
      position_z: 1.5263
      roll: 0.644
      pitch: 0.395
      yaw: 55.458
    - logical_id: CAM_L2
      image_width: 1920
      image_height: 964
      fov: 72.225
      fps: 10.0
      position_x: -1.9101
      position_y: -0.5434
      position_z: 1.3869
      roll: -0.109
      pitch: -1.099
      yaw: -140.948
    - logical_id: CAM_B0
      image_width: 1920
      image_height: 964
      fov: 72.225
      fps: 10.0
      position_x: -1.9116
      position_y: 0.0006
      position_z: 1.4863
      roll: 0.41
      pitch: -0.194
      yaw: -179.721
    - logical_id: CAM_R2
      image_width: 1920
      image_height: 964
      fov: 72.225
      fps: 10.0
      position_x: -1.9226
      position_y: 0.5047
      position_z: 1.3911
      roll: 0.866
      pitch: -0.932
      yaw: 141.309
  control:
    wheelbase_m: 2.85
