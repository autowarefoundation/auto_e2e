# Kueue cluster-scoped objects for GPU queue management.
# Apply after the KubeRay and Kueue CRDs are installed.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-validation-flavor
spec:
  nodeLabels:
    workload-type: gpu-validation
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: p5en-capacity-block-flavor
spec:
  nodeLabels:
    workload-type: p5en-capacity-block
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: research-low
value: 1000
description: "Default priority for research and canary jobs"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: production-high
value: 10000
description: "High priority for production training"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-validation-queue
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - auto-e2e-development
          - auto-e2e-training
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - ephemeral-storage
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "12"
            - name: memory
              nominalQuota: 56Gi
            - name: ephemeral-storage
              nominalQuota: 1000Gi
    - coveredResources:
        - nvidia.com/gpu
      flavors:
        - name: gpu-validation-flavor
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "2"
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: p5en-capacity-block-queue
spec:
  queueingStrategy: BestEffortFIFO
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - auto-e2e-development
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - ephemeral-storage
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "256"
            - name: memory
              nominalQuota: 3Ti
            - name: ephemeral-storage
              nominalQuota: 1500Gi
    - coveredResources:
        - nvidia.com/gpu
      flavors:
        - name: p5en-capacity-block-flavor
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "16"
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-validation
  namespace: auto-e2e-development
spec:
  clusterQueue: gpu-validation-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-validation
  namespace: auto-e2e-training
spec:
  clusterQueue: gpu-validation-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-validation
  namespace: auto-e2e-staging
spec:
  clusterQueue: gpu-validation-queue
  stopPolicy: HoldAndDrain
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-validation
  namespace: auto-e2e-production
spec:
  clusterQueue: gpu-validation-queue
  stopPolicy: HoldAndDrain
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: p5en-capacity-block
  namespace: auto-e2e-development
spec:
  clusterQueue: p5en-capacity-block-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: p5en-capacity-block
  namespace: auto-e2e-staging
spec:
  clusterQueue: p5en-capacity-block-queue
  stopPolicy: HoldAndDrain
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: p5en-capacity-block
  namespace: auto-e2e-production
spec:
  clusterQueue: p5en-capacity-block-queue
  stopPolicy: HoldAndDrain
