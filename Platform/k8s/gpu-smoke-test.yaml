apiVersion: v1
kind: Pod
metadata:
  name: train-smoke-test
  namespace: auto-e2e-development
  labels:
    app: auto-e2e-smoke-test
    kueue.x-k8s.io/queue-name: gpu-validation
    kueue.x-k8s.io/priority-class: research-low
spec:
  restartPolicy: Never
  nodeSelector:
    workload-type: gpu-validation
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: training
      image: REPLACE_WITH_ECR_URL/auto-e2e/training:latest
      args:
        - "--smoke-test"
        - "--batch-size"
        - "4"
        - "--amp"
        - "--no-pretrained"
      resources:
        limits:
          nvidia.com/gpu: "1"
          memory: "16Gi"
          cpu: "2"
        requests:
          nvidia.com/gpu: "1"
          memory: "16Gi"
          cpu: "2"
