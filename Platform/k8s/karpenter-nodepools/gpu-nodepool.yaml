apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-validation
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        workload-type: gpu-validation
    spec:
      expireAfter: 456h
      terminationGracePeriod: 24h
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: auto-e2e-gpu-validation
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6.2xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["reserved"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-west-2a"]
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
  limits:
    cpu: "16"
    memory: 128Gi
    nodes: "2"
    nvidia.com/gpu: "2"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: p5en-capacity-block
spec:
  disruption:
    # Prevent voluntary consolidation and drift while paid training runs.
    budgets:
      - nodes: "0"
    consolidationPolicy: WhenEmpty
    consolidateAfter: Never
  template:
    metadata:
      labels:
        workload-type: p5en-capacity-block
    spec:
      expireAfter: 503h
      # Capacity Block termination leaves a ten-minute Karpenter drain
      # window. Keep this bound below that window for graceful eviction.
      terminationGracePeriod: 5m
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: auto-e2e-p5en-capacity-block
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["p5en.48xlarge", "p5.48xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["reserved"]
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-west-2a
            - us-west-2b
            - us-west-2c
      taints:
        - key: nvidia.com/gpu
          effect: NoSchedule
  limits:
    cpu: "192"
    memory: 2Ti
    nodes: "1"
    nvidia.com/gpu: "8"
