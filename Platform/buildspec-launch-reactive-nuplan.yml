version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-west-2
    FLYTE_PROJECT: auto-e2e
    FLYTE_DOMAIN: development
    WORKFLOW_NAME: >-
      Platform.pipelines.distributed_training.wf_train_reactive_nuplan_ray_8
    FLYTE_VERSION: ""
    EXECUTION_NAME: ""
    NUPLAN_DATASET_URIS_URI: ""
    RESUME_CHECKPOINT_URI: ""
    EPOCHS: "3"
    LEARNING_RATE: "1e-4"
    VAL_FRACTION: "0.1"
    NUM_LOADER_WORKERS: "2"
    PER_RANK_BATCH_SIZE: "4"
    TRAINING_SEED: "149"
    PRECISION: "bf16"
    TRAJECTORY_WEIGHT: "1.0"
    BEV_WEIGHT: "0.0"
    ROUTE_WEIGHT: "1.0"
    CAPACITY_BLOCK_MINIMUM_REMAINING_SECONDS: "79200"
    WAIT_FOR_COMPLETION: "false"
    WAIT_TIMEOUT_SECONDS: "28800"

phases:
  install:
    commands:
      - pip install -q flytekit==1.16.24
  pre_build:
    commands:
      - test -n "${FLYTE_VERSION}"
      - test -n "${EXECUTION_NAME}"
      - test -n "${NUPLAN_DATASET_URIS_URI}"
      - printf '%s' "${NUPLAN_DATASET_URIS_URI}" | grep -Eq '^s3://'
      - test -z "${RESUME_CHECKPOINT_URI}" || printf '%s' "${RESUME_CHECKPOINT_URI}" | grep -Eq '^s3://'
      - aws s3 cp "${NUPLAN_DATASET_URIS_URI}" /tmp/nuplan-dataset-uris.json
      - printf '%s' "${EXECUTION_NAME}" | grep -Eq '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - test "${#EXECUTION_NAME}" -le 63
      - printf '%s' "${EPOCHS}" | grep -Eq '^[1-9][0-9]*$'
      - printf '%s' "${NUM_LOADER_WORKERS}" | grep -Eq '^[0-9]+$'
      - printf '%s' "${PER_RANK_BATCH_SIZE}" | grep -Eq '^(1|2|4)$'
      - printf '%s' "${TRAINING_SEED}" | grep -Eq '^[0-9]+$'
      - printf '%s' "${PRECISION}" | grep -Eq '^(fp32|bf16)$'
      - printf '%s' "${WAIT_FOR_COMPLETION}" | grep -Eq '^(true|false)$'
      - printf '%s' "${WAIT_TIMEOUT_SECONDS}" | grep -Eq '^[1-9][0-9]*$'
      - printf '%s' "${CAPACITY_BLOCK_MINIMUM_REMAINING_SECONDS}" | grep -Eq '^[1-9][0-9]*$'
      - |
        aws ec2 describe-capacity-reservations \
          --filters \
            Name=tag:Name,Values=auto-e2e-p5en-capacity-block \
            Name=instance-type,Values=p5en.48xlarge,p5.48xlarge \
            Name=state,Values=active \
          --query 'CapacityReservations[].{Id:CapacityReservationId,InstanceType:InstanceType,AvailabilityZone:AvailabilityZone,EndDate:EndDate,ReservationType:ReservationType,TotalInstanceCount:TotalInstanceCount}' \
          --output json > /tmp/p5en-capacity-blocks.json
      - |
        python3 - <<'PY'
        from datetime import datetime, timedelta, timezone
        import os
        import json
        from pathlib import Path

        with open(
            "/tmp/nuplan-dataset-uris.json",
            encoding="ascii",
        ) as stream:
            dataset_uris = json.load(stream)
        if (
            not isinstance(dataset_uris, list)
            or len(dataset_uris) != 43
            or len(set(dataset_uris)) != 43
            or any(
                not isinstance(uri, str)
                or not uri.startswith("s3://")
                for uri in dataset_uris
            )
        ):
            raise ValueError(
                "nuPlan dataset URI manifest must contain 43 unique S3 URIs"
            )

        if not 0.0 < float(os.environ["LEARNING_RATE"]):
            raise ValueError("LEARNING_RATE must be positive")
        if not 0.0 < float(os.environ["VAL_FRACTION"]) < 1.0:
            raise ValueError("VAL_FRACTION must be in (0, 1)")
        for name in (
            "TRAJECTORY_WEIGHT",
            "BEV_WEIGHT",
            "ROUTE_WEIGHT",
        ):
            if float(os.environ[name]) < 0.0:
                raise ValueError(f"{name} must be non-negative")

        with open(
            "/tmp/p5en-capacity-blocks.json",
            encoding="ascii",
        ) as stream:
            capacity_blocks = json.load(stream)
        if len(capacity_blocks) != 1:
            raise ValueError(
                "exactly one active tagged P5 Capacity Block is required"
            )
        capacity_block = capacity_blocks[0]
        if (
            capacity_block["ReservationType"] != "capacity-block"
            or int(capacity_block["TotalInstanceCount"]) != 1
        ):
            raise ValueError(
                "P5 reservation must be one Capacity Block instance"
            )
        if capacity_block.get("InstanceType") not in {
            "p5en.48xlarge",
            "p5.48xlarge",
        }:
            raise ValueError(
                "Capacity Block instance type must be p5en or p5"
            )
        if capacity_block.get("AvailabilityZone") not in {
            "us-west-2a",
            "us-west-2b",
            "us-west-2c",
        }:
            raise ValueError(
                "P5 Capacity Block must be in us-west-2a, "
                "us-west-2b, or us-west-2c"
            )
        capacity_block_end_value = capacity_block.get("EndDate")
        if not isinstance(capacity_block_end_value, str):
            raise ValueError(
                "active P5 Capacity Block is missing EndDate"
            )
        capacity_block_end_utc = capacity_block_end_value
        capacity_block_end = datetime.fromisoformat(
            capacity_block_end_utc.replace("Z", "+00:00")
        )
        minimum_remaining_seconds = int(
            os.environ[
                "CAPACITY_BLOCK_MINIMUM_REMAINING_SECONDS"
            ]
        )
        workflow_name = os.environ["WORKFLOW_NAME"]
        if workflow_name.endswith(
            "wf_train_reactive_nuplan_l2d_ray_8"
        ):
            minimum_remaining_seconds = max(
                minimum_remaining_seconds,
                42 * 60 * 60,
            )
        minimum_end = datetime.now(timezone.utc) + timedelta(
            seconds=minimum_remaining_seconds
        )
        if capacity_block_end.astimezone(timezone.utc) < minimum_end:
            raise ValueError(
                "P5 Capacity Block remaining window is shorter than "
                "CAPACITY_BLOCK_MINIMUM_REMAINING_SECONDS"
            )
        Path("/tmp/p5en-capacity-block-end.txt").write_text(
            capacity_block_end_utc,
            encoding="ascii",
        )
        PY
      - |
        cat > /tmp/flyte.yaml << EOF
        admin:
          endpoint: dns:///k8s-flyte-flyteadm-be92e7737c-cf0d1a0f3df10f77.elb.us-west-2.amazonaws.com:81
          insecure: true
        EOF
  build:
    commands:
      - |
        python3 - <<'PY'
        import os
        import json
        import time

        import grpc
        from flytekit.configuration import Config
        from flytekit.exceptions.user import (
            FlyteEntityAlreadyExistsException,
            FlyteEntityNotExistException,
        )
        from flytekit.models.core.execution import WorkflowExecutionPhase
        from flytekit.remote import FlyteRemote
        from flytekit.types.directory import FlyteDirectory

        project = os.environ["FLYTE_PROJECT"]
        domain = os.environ["FLYTE_DOMAIN"]
        workflow_name = os.environ["WORKFLOW_NAME"]
        version = os.environ["FLYTE_VERSION"]
        execution_name = os.environ["EXECUTION_NAME"]
        wait_for_completion = (
            os.environ["WAIT_FOR_COMPLETION"] == "true"
        )
        with open(
            "/tmp/nuplan-dataset-uris.json",
            encoding="ascii",
        ) as stream:
            dataset_uris = json.load(stream)
        with open(
            "/tmp/p5en-capacity-block-end.txt",
            encoding="ascii",
        ) as stream:
            capacity_block_end_utc = stream.read().strip()
        inputs = {
            "nuplan_shards": [
                FlyteDirectory(uri) for uri in dataset_uris
            ],
            "resume_checkpoint": (
                FlyteDirectory(
                    os.environ["RESUME_CHECKPOINT_URI"].rstrip("/")
                )
                if os.environ["RESUME_CHECKPOINT_URI"]
                else None
            ),
            "epochs": int(os.environ["EPOCHS"]),
            "learning_rate": float(os.environ["LEARNING_RATE"]),
            "val_fraction": float(os.environ["VAL_FRACTION"]),
            "num_loader_workers": int(
                os.environ["NUM_LOADER_WORKERS"]
            ),
            "per_rank_batch_size": int(
                os.environ["PER_RANK_BATCH_SIZE"]
            ),
            "training_seed": int(os.environ["TRAINING_SEED"]),
            "precision": os.environ["PRECISION"],
            "trajectory_weight": float(
                os.environ["TRAJECTORY_WEIGHT"]
            ),
            "bev_weight": float(os.environ["BEV_WEIGHT"]),
            "route_weight": float(os.environ["ROUTE_WEIGHT"]),
            "capacity_block_end_utc": capacity_block_end_utc,
        }
        remote = FlyteRemote(
            config=Config.auto(config_file="/tmp/flyte.yaml"),
            default_project=project,
            default_domain=domain,
        )
        launch_plan = remote.fetch_launch_plan(
            project=project,
            domain=domain,
            name=workflow_name,
            version=version,
        )

        def grpc_code(error):
            visited = set()
            candidate = error
            while candidate is not None and id(candidate) not in visited:
                visited.add(id(candidate))
                if isinstance(candidate, grpc.RpcError):
                    return candidate.code()
                candidate = (
                    candidate.__cause__
                    if candidate.__cause__ is not None
                    else candidate.__context__
                )
            return None

        transient_codes = {
            grpc.StatusCode.DEADLINE_EXCEEDED,
            grpc.StatusCode.INTERNAL,
            grpc.StatusCode.RESOURCE_EXHAUSTED,
            grpc.StatusCode.UNAVAILABLE,
            grpc.StatusCode.UNKNOWN,
        }
        deadline = time.monotonic() + 300
        execution = None
        while execution is None:
            try:
                execution = remote.fetch_execution(
                    project=project,
                    domain=domain,
                    name=execution_name,
                )
            except FlyteEntityNotExistException:
                pass
            except Exception as error:
                if grpc_code(error) not in transient_codes:
                    raise
            if execution is None:
                try:
                    execution = remote.execute(
                        launch_plan,
                        inputs=inputs,
                        execution_name=execution_name,
                        wait=False,
                    )
                except FlyteEntityAlreadyExistsException:
                    pass
                except Exception as error:
                    if grpc_code(error) not in transient_codes:
                        raise
            if execution is None:
                if time.monotonic() >= deadline:
                    raise TimeoutError(
                        "timed out fetching or creating Flyte execution"
                    )
                time.sleep(5)

        print(f"FLYTE_EXECUTION_ID={execution.id.name}", flush=True)
        if not wait_for_completion:
            print("FLYTE_EXECUTION_DETACHED=true", flush=True)
            raise SystemExit(0)

        terminal_phases = {
            WorkflowExecutionPhase.ABORTED,
            WorkflowExecutionPhase.FAILED,
            WorkflowExecutionPhase.SUCCEEDED,
            WorkflowExecutionPhase.TIMED_OUT,
        }
        deadline = (
            time.monotonic()
            + int(os.environ["WAIT_TIMEOUT_SECONDS"])
        )
        while True:
            try:
                execution = remote.sync_execution(
                    execution,
                    sync_nodes=True,
                )
            except Exception as error:
                code = grpc_code(error)
                if code not in transient_codes:
                    raise
                print(
                    f"FLYTE_ADMIN_TRANSIENT_RETRY={code.name}",
                    flush=True,
                )
            else:
                if execution.closure.phase in terminal_phases:
                    break
            if time.monotonic() >= deadline:
                raise TimeoutError(
                    f"timed out waiting for {execution_name}"
                )
            time.sleep(15)

        phase = execution.closure.phase
        phase_name = WorkflowExecutionPhase.enum_to_string(phase)
        print(f"FLYTE_EXECUTION_PHASE={phase_name}", flush=True)
        if phase != WorkflowExecutionPhase.SUCCEEDED:
            if execution.error is not None:
                print(
                    f"FLYTE_EXECUTION_ERROR={execution.error}",
                    flush=True,
                )
            raise SystemExit(
                f"Flyte execution {execution.id.name} "
                f"ended in {phase_name}"
            )
        print(f"FLYTE_EXECUTION_OUTPUTS={execution.outputs}", flush=True)
        PY
