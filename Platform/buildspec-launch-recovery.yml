version: 0.2

# Repack the audited KITScenes raw/Cosmos artifacts, then train and evaluate.
# This workflow never runs source ingest or the Cosmos teacher.
#
# Required start-build overrides:
#   ARTIFACT_SET_SHA256
# Optional:
#   RECOVERY_MANIFEST_URI, IMAGE_TAG, EPOCHS, TRAINING_SEED,
#   MAX_PARTITIONS, VALIDATION_SCOPE, ENABLE_ROUTE_CONDITIONING,
#   ENABLE_JUNCTION_SAMPLING, ENABLE_ROUTE_CONSISTENCY,
#   RECONSTRUCTION_AUDIT_URI, RECONSTRUCTION_AUDIT_DECISION,
#   RECONSTRUCTION_AUDIT_RATIONALE, RESUME_FROM,
#   ALLOW_RESUME_POLICY_TRANSITION

env:
  shell: bash
  variables:
    AWS_DEFAULT_REGION: us-west-2
    FLYTE_PROJECT: auto-e2e
    FLYTE_DOMAIN: development
    ARTIFACT_SET_SHA256: ""
    RECOVERY_MANIFEST_URI: ""
    DATASET_VERSION: v3.3
    PACK_CONCURRENCY: "60"
    MAX_PARTITIONS: "0"
    BACKBONE: "swin_v2_tiny"
    EPOCHS: "20"
    BATCH_SIZE: "1"
    GRAD_ACCUM_STEPS: "4"
    LR: "1e-4"
    TRAINING_SEED: "149"
    ENABLE_ROUTE_CONDITIONING: "true"
    TRAINING_OBJECTIVE_VERSION: rollout_aligned_planner_v1
    ENABLE_JUNCTION_SAMPLING: "false"
    ENABLE_ROUTE_CONSISTENCY: "false"
    ROUTE_CONSISTENCY_WEIGHT: "0.10"
    RECONSTRUCTION_AUDIT_URI: ""
    RECONSTRUCTION_AUDIT_DECISION: ""
    RECONSTRUCTION_AUDIT_RATIONALE: ""
    VAL_FRACTION: "0.1"
    VALIDATION_SCOPE: full
    NUM_WORKERS: "4"
    EARLY_STOPPING_PATIENCE: "5"
    RESUME_FROM: ""
    ALLOW_RESUME_POLICY_TRANSITION: "false"
    IMAGE_TAG: latest

phases:
  install:
    commands:
      - pip install -q flytekit==1.14.9 numpy torch kubernetes --extra-index-url https://download.pytorch.org/whl/cpu
  build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URL="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export ECR_PREFIX="${ECR_URL}"
      - export PYTHONPATH="${CODEBUILD_SRC_DIR}/Model:${CODEBUILD_SRC_DIR}:${PYTHONPATH:-}"
      - test -n "${ARTIFACT_SET_SHA256}"
      - |
        if [ -z "${RECOVERY_MANIFEST_URI}" ]; then
          RECOVERY_MANIFEST_URI="s3://auto-e2e-platform-checkpoints-${ACCOUNT_ID}/recovery-manifests/${ARTIFACT_SET_SHA256}.json"
        fi
        export RECOVERY_MANIFEST_URI
      - |
        image_ref() {
          REPOSITORY="$1"
          DIGEST=$(aws ecr batch-get-image \
            --repository-name "auto-e2e/${REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageId.imageDigest' \
            --output text)
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "None" ]; then
            echo "No digest found for auto-e2e/${REPOSITORY}:${IMAGE_TAG}" >&2
            return 1
          fi
          printf '%s/auto-e2e/%s@%s' \
            "${ECR_URL}" "${REPOSITORY}" "${DIGEST}"
        }
        AUTO_E2E_TRAINING_IMAGE="$(image_ref training)" || exit 1
        AUTO_E2E_EVAL_IMAGE="$(image_ref eval)" || exit 1
        AUTO_E2E_OFFLINE_RL_IMAGE="$(image_ref offline-rl)" || exit 1
        AUTO_E2E_DATA_PREP_IMAGE="$(image_ref data-prep)" || exit 1
        export AUTO_E2E_TRAINING_IMAGE AUTO_E2E_EVAL_IMAGE
        export AUTO_E2E_OFFLINE_RL_IMAGE AUTO_E2E_DATA_PREP_IMAGE
      - |
        cat > /tmp/flyte.yaml << EOF
        admin:
          endpoint: dns:///k8s-flyte-flyteadm-be92e7737c-cf0d1a0f3df10f77.elb.us-west-2.amazonaws.com:81
          insecure: true
        EOF
      - |
        RUN_ARGS=(
          --recovery_manifest "${RECOVERY_MANIFEST_URI}"
          --artifact_set_sha256 "${ARTIFACT_SET_SHA256}"
          --dataset_version "${DATASET_VERSION}"
          --pack_concurrency "${PACK_CONCURRENCY}"
          --max_partitions "${MAX_PARTITIONS}"
          --backbone "${BACKBONE}"
          --epochs "${EPOCHS}"
          --batch_size "${BATCH_SIZE}"
          --grad_accum_steps "${GRAD_ACCUM_STEPS}"
          --lr "${LR}"
          --training_seed "${TRAINING_SEED}"
          --training_objective_version "${TRAINING_OBJECTIVE_VERSION}"
          --route_consistency_weight "${ROUTE_CONSISTENCY_WEIGHT}"
          --val_fraction "${VAL_FRACTION}"
          --validation_scope "${VALIDATION_SCOPE}"
          --num_workers "${NUM_WORKERS}"
          --early_stopping_patience "${EARLY_STOPPING_PATIENCE}"
        )
        case "${ENABLE_ROUTE_CONDITIONING,,}" in
          true)
            RUN_ARGS+=(--enable_route_conditioning)
            ;;
          false)
            RUN_ARGS+=(--no_enable_route_conditioning)
            ;;
          *)
            echo "ENABLE_ROUTE_CONDITIONING must be true or false" >&2
            exit 2
            ;;
        esac
        case "${ENABLE_JUNCTION_SAMPLING,,}" in
          true)
            RUN_ARGS+=(--enable_junction_sampling)
            ;;
          false)
            RUN_ARGS+=(--no_enable_junction_sampling)
            ;;
          *)
            echo "ENABLE_JUNCTION_SAMPLING must be true or false" >&2
            exit 2
            ;;
        esac
        case "${ENABLE_ROUTE_CONSISTENCY,,}" in
          true)
            RUN_ARGS+=(--enable_route_consistency)
            ;;
          false)
            RUN_ARGS+=(--no_enable_route_consistency)
            ;;
          *)
            echo "ENABLE_ROUTE_CONSISTENCY must be true or false" >&2
            exit 2
            ;;
        esac
        case "${ALLOW_RESUME_POLICY_TRANSITION,,}" in
          true)
            RUN_ARGS+=(--allow_resume_policy_transition)
            ;;
          false)
            RUN_ARGS+=(--no_allow_resume_policy_transition)
            ;;
          *)
            echo "ALLOW_RESUME_POLICY_TRANSITION must be true or false" >&2
            exit 2
            ;;
        esac
        if [ -n "${RESUME_FROM}" ]; then
          RUN_ARGS+=(--resume_from "${RESUME_FROM}")
        fi
        if [ -n "${RECONSTRUCTION_AUDIT_URI}" ]; then
          RUN_ARGS+=(
            --reconstruction_audit "${RECONSTRUCTION_AUDIT_URI}"
            --reconstruction_audit_decision "${RECONSTRUCTION_AUDIT_DECISION}"
            --reconstruction_audit_rationale "${RECONSTRUCTION_AUDIT_RATIONALE}"
          )
        fi
        pyflyte --config /tmp/flyte.yaml run --remote \
          --project "${FLYTE_PROJECT}" \
          --domain "${FLYTE_DOMAIN}" \
          --image "${AUTO_E2E_TRAINING_IMAGE}" \
          Platform/pipelines/workflows.py \
          wf_recovered_kitscenes_full_run \
          "${RUN_ARGS[@]}"
