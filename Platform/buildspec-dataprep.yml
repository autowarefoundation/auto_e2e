version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-west-2
    IMAGE_TAG: ""

phases:
  pre_build:
    commands:
      - test -n "${IMAGE_TAG}"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URL="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URL
      - docker pull "${ECR_URL}/auto-e2e/data-prep:latest" || true
  build:
    commands:
      - echo "=== Building data-prep image ==="
      - >
        DOCKER_BUILDKIT=1 docker build
        --cache-from "${ECR_URL}/auto-e2e/data-prep:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t "${ECR_URL}/auto-e2e/data-prep:${IMAGE_TAG}"
        -f Platform/docker/data-prep/Dockerfile .
      - docker push "${ECR_URL}/auto-e2e/data-prep:${IMAGE_TAG}"
  post_build:
    commands:
      - >
        aws ecr describe-images
        --repository-name auto-e2e/data-prep
        --image-ids imageTag="${IMAGE_TAG}"
        --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt,size:imageSizeInBytes}'
        --output json

cache:
  paths:
    - '/root/.cache/pip/**/*'
