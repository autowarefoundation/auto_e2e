[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpasim-autoe2e-driver"
version = "0.1.0"
description = "AutoE2E driver plugin for AlpaSim"
dependencies = [
    "torch",
    "numpy",
    "torchvision",
    "Pillow"
]

[tool.setuptools]
py-modules = ["plugin", "config", "alpasim_autoe2e_plugin", "alpasim_autoe2e_config"]

[project.entry-points."alpasim.models"]
autoe2e = "alpasim_autoe2e_plugin:AutoE2EDriver"

[project.entry-points."alpasim.configs"]
autoe2e = "alpasim_autoe2e_config:AutoE2EAlpaSimConfig"


