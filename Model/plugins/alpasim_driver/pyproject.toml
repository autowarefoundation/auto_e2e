[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpasim-autoe2e-driver"
version = "0.1.0"
description = "AutoE2E driver plugin for AlpaSim"
dependencies = [
    "torch",
    "numpy",
    "torchvision",
    "Pillow"
]

[tool.setuptools]
packages = ["alpasim_driver"]

[tool.setuptools.package-dir]
"alpasim_driver" = "."

[project.entry-points."alpasim.models"]
autoe2e = "alpasim_driver.plugin:AutoE2EDriver"

[project.entry-points."alpasim.configs"]
autoe2e = "alpasim_driver.config:AutoE2EAlpaSimConfig"


