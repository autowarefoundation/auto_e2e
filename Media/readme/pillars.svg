<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">What AutoE2E is</title>
  <desc id="desc">Camera-first: one network turns surround cameras and ego-motion into a trajectory. No HD maps needed: drives highways, arterial roads and city streets. Fully open: model code, data pipelines, training platform and checkpoints are developed in the open.</desc>
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1236"/><stop offset="1" stop-color="#0e0b1d"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11233a"/><stop offset="1" stop-color="#0a1322"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2a2c"/><stop offset="1" stop-color="#081719"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a24bf5"/><stop offset="1" stop-color="#5ee0d6"/></linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .k { font-size: 12px; font-weight: 800; letter-spacing: 2.5px; }
      .h { fill: #ffffff; font-size: 21px; font-weight: 800; }
      .s { fill: #9aa7bf; font-size: 13.5px; }
      .card { animation: rise 6s ease-in-out infinite; }
      .card2 { animation-delay: -2s; }
      .card3 { animation-delay: -4s; }
      .sweep { animation: sweep 3s linear infinite; transform-origin: 70px 62px; }
      .dash { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
      .spin { animation: spin 10s linear infinite; transform-origin: 70px 62px; }
      @keyframes rise { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes sweep { to { transform: rotate(360deg); } }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g class="card">
    <rect x="4" y="12" width="320" height="206" rx="20" fill="url(#c1)" stroke="#a24bf5" stroke-opacity="0.5"/>
    <g transform="translate(28 30)">
      <circle cx="42" cy="32" r="30" fill="#a24bf5" fill-opacity="0.12" stroke="#a24bf5" stroke-opacity="0.5"/>
      <path d="M42 32 L42 4 A28 28 0 0 1 66 18 Z" fill="#c4a5ff" fill-opacity="0.35" class="sweep" style="transform-origin:42px 32px"/>
      <rect x="31" y="24" width="22" height="16" rx="4" fill="#c4a5ff"/>
      <circle cx="42" cy="32" r="5" fill="#1b1236"/>
    </g>
    <text x="28" y="122" class="k" fill="#c4a5ff">CAMERA-FIRST</text>
    <text x="28" y="150" class="h">One network, end to end</text>
    <text x="28" y="176" class="s">Surround cameras and ego-motion in,</text>
    <text x="28" y="195" class="s">a 6.4 s driving trajectory out.</text>
  </g>

  <g class="card card2">
    <rect x="340" y="12" width="320" height="206" rx="20" fill="url(#c2)" stroke="#60a5fa" stroke-opacity="0.5"/>
    <g transform="translate(364 30)">
      <path d="M4 58 C24 52 30 20 50 18 S74 30 86 6" fill="none" stroke="#93c5fd" stroke-width="3" class="dash"/>
      <circle cx="4" cy="58" r="5" fill="#93c5fd"/>
      <path d="M80 2 l8 0 0 8" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
      <path d="M96 20 l14 14 M110 20 l-14 14" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="364" y="122" class="k" fill="#93c5fd">NO HD MAPS</text>
    <text x="364" y="150" class="h">Highways to city streets</text>
    <text x="364" y="176" class="s">An optional map raster adds route</text>
    <text x="364" y="195" class="s">context; cameras alone can drive.</text>
  </g>

  <g class="card card3">
    <rect x="676" y="12" width="320" height="206" rx="20" fill="url(#c3)" stroke="#5ee0d6" stroke-opacity="0.5"/>
    <g transform="translate(700 30)">
      <g class="spin" style="transform-origin:42px 32px">
        <circle cx="42" cy="32" r="26" fill="none" stroke="#5ee0d6" stroke-width="3" stroke-dasharray="14 7"/>
      </g>
      <path d="M33 22 l-10 10 10 10 M51 22 l10 10 -10 10" fill="none" stroke="#7ff0e3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="700" y="122" class="k" fill="#7ff0e3">FULLY OPEN</text>
    <text x="700" y="150" class="h">Built by the community</text>
    <text x="700" y="176" class="s">Model code, data pipelines, training</text>
    <text x="700" y="195" class="s">and checkpoints, developed in the open.</text>
  </g>
</svg>
