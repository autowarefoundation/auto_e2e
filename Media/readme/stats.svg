<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-labelledby="title desc">
  <title id="title">AutoE2E v1.0 at a glance</title>
  <desc id="desc">79.9 million parameters, 6 surround cameras, 6.4 second planning horizon, 10 Hz trajectory output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140f2a"/>
      <stop offset="1" stop-color="#0a2027"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#5ee0d6"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .v { fill: url(#brand); font-size: 36px; font-weight: 800; }
      .u { fill: #c7d2e4; font-size: 18px; font-weight: 700; }
      .l { fill: #8b97ad; font-size: 13px; font-weight: 600; letter-spacing: 1.6px; }
      .bar { animation: fill 4s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
      .b2 { animation-delay: -1s; } .b3 { animation-delay: -2s; } .b4 { animation-delay: -3s; }
      @keyframes fill { 0%, 100% { transform: scaleX(.25); opacity: .5; } 50% { transform: scaleX(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="118" rx="20" fill="url(#bg)" stroke="url(#brand)" stroke-opacity="0.4"/>
  <path d="M250 24V96M500 24V96M750 24V96" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(36 0)">
    <text x="0" y="60" class="v">79.9<tspan class="u" dx="6">M</tspan></text>
    <text x="0" y="84" class="l">PARAMETERS</text>
    <rect class="bar" x="0" y="96" width="170" height="3" rx="1.5" fill="url(#brand)"/>
  </g>
  <g transform="translate(286 0)">
    <text x="0" y="60" class="v">6<tspan class="u" dx="6">cameras</tspan></text>
    <text x="0" y="84" class="l">SURROUND VIEW</text>
    <rect class="bar b2" x="0" y="96" width="170" height="3" rx="1.5" fill="url(#brand)"/>
  </g>
  <g transform="translate(536 0)">
    <text x="0" y="60" class="v">6.4<tspan class="u" dx="6">s</tspan></text>
    <text x="0" y="84" class="l">PLANNING HORIZON</text>
    <rect class="bar b3" x="0" y="96" width="170" height="3" rx="1.5" fill="url(#brand)"/>
  </g>
  <g transform="translate(786 0)">
    <text x="0" y="60" class="v">10<tspan class="u" dx="6">Hz</tspan></text>
    <text x="0" y="84" class="l">TRAJECTORY OUTPUT</text>
    <rect class="bar b4" x="0" y="96" width="170" height="3" rx="1.5" fill="url(#brand)"/>
  </g>
</svg>
