<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="78" viewBox="0 0 1000 78" role="img" aria-label="Get started">
  <title>Get started</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee0d6"/>
      <stop offset="1" stop-color="#5ee0d6" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { fill: #5ee0d6; font-size: 15px; font-weight: 800; letter-spacing: 2px; }
      .h { fill: #5ee0d6; font-size: 30px; font-weight: 800; }
      .s { fill: #8b97ad; font-size: 14px; }
      .dot { animation: travel 5s ease-in-out infinite; }
      .ping { animation: ping 2s ease-out infinite; transform-origin: 26px 39px; }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(560px); opacity: 0; } }
      @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <circle class="ping" cx="26" cy="39" r="13" fill="none" stroke="#5ee0d6" stroke-width="2"/>
  <circle cx="26" cy="39" r="13" fill="#5ee0d6" fill-opacity="0.16" stroke="#5ee0d6" stroke-width="2"/>
  <text x="26" y="44.5" text-anchor="middle" class="num" style="font-size:12px;letter-spacing:0">03</text>
  <text x="56" y="44" class="h">Get started</text>
  <text x="256" y="44" class="s">Install, test and load the checkpoints</text>
  <rect x="56" y="62" width="940" height="2" rx="1" fill="url(#line)"/>
  <circle class="dot" cx="60" cy="63" r="3.5" fill="#5ee0d6"/>
</svg>
